name: MiniSQL 回归检查

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r database_system/requirements.txt
      - run: python -m pytest
      - run: python -m tools.case_runner --suite all
        working-directory: database_system
      - run: python -m tools.optional_demo
        working-directory: database_system
